<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web Code Studio Pro v10</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    
    <style>
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overflow: hidden;
            touch-action: none;
            background-color: #1e1e1e;
            height: 100dvh; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .view-layer { display: none; height: 100%; width: 100%; }
        .view-layer.active { display: block; }
        
        /* 言語別アイコンカラー */
        .icon-html { color: #e34f26; }
        .icon-css { color: #1572b6; }
        .icon-js { color: #f7df1e; }
        .icon-ts { color: #3178c6; }
        .icon-python { color: #3776ab; }
        .icon-json { color: #cbcb41; }
        .icon-cpp { color: #00599c; }
        .icon-csharp { color: #239120; }
        .icon-md { color: #ffffff; }
        .icon-txt { color: #858585; }
        .icon-sh { color: #4ebd3a; }
        .icon-sql { color: #00758f; }
        .icon-yaml { color: #cb171e; }
        .icon-xml { color: #0066b3; }

        #sidebar { transition: transform 0.2s ease, width 0s; }
        #sidebar.collapsed { width: 0px !important; min-width: 0px !important; border-right-width: 0px; }
        #resizer { cursor: col-resize; touch-action: none; }
        #resizer:hover, #resizer.resizing { background-color: #007acc !important; }

        /* コンテナクエリを利用した「一括」ボタンのレイアウト柔軟化 */
        #searchContainer { container-type: inline-size; }
        @container (max-width: 170px) {
            #replaceWrapper { flex-direction: column !important; }
            #btnReplaceAll { width: 100% !important; height: 28px; margin-top: 4px; }
        }
    </style>
</head>
<body class="text-[#cccccc] flex flex-col select-none text-sm">

    <header class="bg-[#3c3c3c] text-white text-sm px-4 h-10 flex items-center justify-between border-b border-[#2b2b2b] shrink-0">
        <div class="flex items-center space-x-4">
            <button onclick="toggleSidebar()" class="hover:bg-[#4e4e4e] px-2 py-1 rounded text-base transition" title="サイドバーの開閉">☰</button>
            <span class="font-bold text-[#007acc] text-base tracking-wide">WebStudio Pro</span>
            <span id="topFileName" class="opacity-60 text-xs md:text-sm">main.js</span>
        </div>
        <div class="flex items-center space-x-3 text-xs md:text-sm">
            <span id="wakeLockStatus" class="text-[11px] text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-800/50 flex items-center space-x-1">
                <span>☕</span><span class="hidden sm:inline">Awake</span>
            </span>
            <button onclick="openDownloadModal()" class="bg-[#0e639c] hover:bg-[#1177bb] px-2.5 py-1 rounded transition font-medium flex items-center space-x-1">
                <span>💾</span><span>保存・DL</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- サイドバー -->
        <aside id="sidebar" class="w-52 bg-[#252526] flex flex-col border-r border-[#2b2b2b] shrink-0 overflow-hidden z-10">
            <div class="flex bg-[#2d2d2d] border-b border-[#232324] text-xs font-bold uppercase tracking-wider text-gray-400 shrink-0">
                <button id="btnNavExplorer" onclick="switchSidebarView('explorer')" class="flex-1 py-2 text-center border-b-2 border-[#007acc] text-white bg-[#252526]">Explorer</button>
                <button id="btnNavSearch" onclick="switchSidebarView('search')" class="flex-1 py-2 text-center border-b-2 border-transparent hover:text-white">Search</button>
            </div>

            <!-- エクスプローラー -->
            <div id="sideViewExplorer" class="flex-1 flex flex-col overflow-hidden">
                <div class="p-2 flex items-center justify-between border-b border-[#333] text-xs font-bold text-gray-400 whitespace-nowrap">
                    <span>Workspace</span>
                    <div class="flex items-center space-x-2">
                        <button onclick="document.getElementById('fileUploadInput').click()" class="hover:bg-[#333] p-1 rounded text-white text-base" title="ファイルをアップロード">📤</button>
                        <button onclick="promptNewFolder()" class="hover:bg-[#333] p-1 rounded text-white text-sm" title="新規フォルダ作成">📁+</button>
                        <button onclick="promptNewFile()" class="hover:bg-[#333] p-1 rounded text-white text-xl" title="新規ファイル作成">＋</button>
                    </div>
                </div>
                <div id="fileList" class="flex-1 overflow-y-auto no-scrollbar py-2 text-sm md:text-[14px]"></div>
            </div>

            <!-- 全文検索・置換パネル -->
            <div id="sideViewSearch" class="flex-1 flex flex-col p-3 space-y-3 overflow-y-auto no-scrollbar hidden">
                <div id="searchContainer" class="w-full space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1">Search</label>
                        <input type="text" id="searchInput" oninput="execGlobalSearch()" placeholder="検索キーワード" class="w-full bg-[#3c3c3c] border border-[#555] p-1.5 rounded text-xs text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1">Replace</label>
                        <div id="replaceWrapper" class="flex flex-row items-stretch">
                            <input type="text" id="replaceInput" placeholder="置換後の文字列" class="flex-1 min-w-0 bg-[#3c3c3c] border border-[#555] p-1.5 rounded text-xs text-white outline-none">
                            <button id="btnReplaceAll" onclick="execGlobalReplace()" class="bg-[#0e639c] hover:bg-[#1177bb] px-2 text-xs text-white rounded transition ml-1 shrink-0 font-medium whitespace-nowrap">一括</button>
                        </div>
                    </div>
                </div>
                <div class="border-t border-[#333] pt-2">
                    <div id="searchResultsCount" class="text-xs text-gray-400 mb-2 font-medium">0 件のマッチ</div>
                    <div id="searchResultsList" class="space-y-2 text-xs max-h-[300px] overflow-y-auto no-scrollbar"></div>
                </div>
            </div>

            <input type="file" id="fileUploadInput" class="hidden" onchange="handleFileUpload(this)">

            <div class="border-t border-[#333] shrink-0">
                <button onclick="openSettings()" class="w-full p-3 hover:bg-[#333] flex items-center space-x-3 transition whitespace-nowrap">
                    <span class="text-base">⚙️</span>
                    <span class="text-sm font-medium">Settings</span>
                </button>
            </div>
        </aside>

        <div id="resizer" class="w-[4px] bg-[#2b2b2b] shrink-0 z-20 transition-colors duration-150"></div>

        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- タブバー -->
            <div id="tabBar" class="flex bg-[#252526] h-10 overflow-x-auto no-scrollbar shrink-0 text-xs md:text-sm"></div>
            
            <!-- クイック入力ツールバー -->
            <div id="quickInputBar" class="bg-[#2d2d2d] border-b border-[#232324] h-9 px-2 flex items-center space-x-1.5 overflow-x-auto no-scrollbar shrink-0">
                <!-- 全選択・全コピー -->
                <button onclick="executeSelectAll()" class="bg-[#444] hover:bg-[#555] text-white text-xs px-2 py-1 rounded transition shrink-0 font-medium">全選択</button>
                <button onclick="executeCopyAll()" class="bg-[#444] hover:bg-[#555] text-white text-xs px-2 py-1 rounded transition shrink-0 font-medium">全コピー</button>
                <div class="h-4 w-[1px] bg-[#555] shrink-0"></div>
                
                <button onclick="insertTemplate()" class="bg-[#0e639c] hover:bg-[#1177bb] text-white text-xs px-2 py-1 rounded transition shrink-0 font-bold">📄 HTML雛形</button>
                <div class="h-4 w-[1px] bg-[#444] shrink-0 mr-1"></div>
                
                <button onclick="insertSymbol('<>')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">&lt;&gt;</button>
                <button onclick="insertSymbol('{}')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">{}</button>
                <button onclick="insertSymbol('[]')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">[]</button>
                <button onclick="insertSymbol('()')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">()</button>
                <button onclick="insertSymbol('\"\"')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">""</button>
                <button onclick="insertSymbol('\'\'')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">''</button>
                <button onclick="insertSymbol('`')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">`</button>
                <button onclick="insertSymbol('*')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">*</button>
                <button onclick="insertSymbol('~')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">~</button>
                <button onclick="insertSymbol('_')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">_</button>
                <button onclick="insertSymbol('!')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">!</button>
                <button onclick="insertSymbol('#')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">#</button>
                <button onclick="insertSymbol('%')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">%</button>
                <button onclick="insertSymbol(';')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">;</button>
                <button onclick="insertSymbol('=')" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-gray-200 text-xs px-2.5 py-1 rounded transition font-mono font-bold shrink-0">=</button>
            </div>
            
            <div class="flex-1 relative bg-[#1e1e1e]">
                <!-- 通常エディタ層 -->
                <div id="editorLayer" class="view-layer active">
                    <div id="editorContainer" class="w-full h-full"></div>
                </div>

                <!-- 差分ビューア層 (新機能) -->
                <div id="diffLayer" class="view-layer">
                    <div id="diffContainer" class="w-full h-full"></div>
                </div>

                <!-- 設定画面層 -->
                <div id="settingsLayer" class="view-layer bg-[#1e1e1e] p-6 md:p-10 overflow-y-auto text-sm md:text-[15px]">
                    <h2 class="text-2xl md:text-3xl mb-6 font-light">Settings</h2>
                    <div class="max-w-xl space-y-8 pb-12">
                        <section>
                            <label class="block font-bold mb-2 text-gray-400">Editor: Font Size</label>
                            <div class="flex items-center space-x-4">
                                <input type="range" id="fontSizeRange" min="10" max="30" step="1" oninput="updateSettingsFromUI()" class="flex-1">
                                <span id="fontSizeVal" class="w-12 text-center font-bold">16</span>
                            </div>
                        </section>

                        <section>
                            <label class="block font-bold mb-2 text-gray-400">Editor: Tab Size</label>
                            <select id="tabSizeSelect" onchange="updateSettingsFromUI()" class="w-full bg-[#3c3c3c] border border-[#555] p-2.5 rounded outline-none text-sm">
                                <option value="2">2 スペース</option>
                                <option value="4">4 スペース</option>
                                <option value="8">8 スペース</option>
                            </select>
                        </section>

                        <section>
                            <label class="block font-bold mb-2 text-gray-400">Editor: Word Wrap</label>
                            <select id="wordWrapSelect" onchange="updateSettingsFromUI()" class="w-full bg-[#3c3c3c] border border-[#555] p-2.5 rounded outline-none text-sm">
                                <option value="on">on</option>
                                <option value="off">off</option>
                            </select>
                        </section>

                        <section>
                            <label class="block font-bold mb-2 text-gray-400">Editor: Line Numbers</label>
                            <select id="lineNumbersSelect" onchange="updateSettingsFromUI()" class="w-full bg-[#3c3c3c] border border-[#555] p-2.5 rounded outline-none text-sm">
                                <option value="on">on</option>
                                <option value="off">off</option>
                            </select>
                        </section>

                        <section>
                            <label class="block font-bold mb-2 text-gray-400">Editor: Minimap</label>
                            <select id="minimapSelect" onchange="updateSettingsFromUI()" class="w-full bg-[#3c3c3c] border border-[#555] p-2.5 rounded outline-none text-sm">
                                <option value="off">off</option>
                                <option value="on">on</option>
                            </select>
                        </section>

                        <section>
                            <label class="block font-bold mb-2 text-gray-400">Files: Auto Save Delay</label>
                            <div class="flex items-center space-x-4">
                                <input type="range" id="autoSaveRange" min="0" max="5000" step="100" oninput="updateSettingsFromUI()" class="flex-1">
                                <span id="autoSaveVal" class="w-16 text-center font-bold">500ms</span>
                            </div>
                        </section>

                        <section>
                            <label class="block font-bold mb-2 text-gray-400">Editor: Color Theme</label>
                            <select id="themeSelect" onchange="updateSettingsFromUI()" class="w-full bg-[#3c3c3c] border border-[#555] p-2.5 rounded outline-none text-sm">
                                <option value="vs-dark">Visual Studio Dark</option>
                                <option value="vs-light">Visual Studio Light</option>
                                <option value="hc-black">High Contrast</option>
                            </select>
                        </section>

                        <section class="pt-6 border-t border-[#333]">
                            <button onclick="resetAllData()" class="bg-red-900/30 hover:bg-red-900/50 text-red-400 px-4 py-2 rounded text-xs transition">
                                すべてのデータを初期化
                            </button>
                        </section>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- フッター (新機能: 英語カウンター構成強化) -->
    <footer class="bg-[#007acc] text-white text-xs px-3 h-6 flex items-center justify-between shrink-0 select-none font-sans">
        <div id="statusInfo">Ready</div>
        <div class="flex items-center space-x-4">
            <div id="editorStats" class="opacity-90 flex items-center space-x-3">
                <span id="cursorPos">Ln 1, Col 1</span>
                <span id="statSelected" class="hidden sm:inline bg-white/20 px-1 rounded text-[10px]">0 selected</span>
                <span id="statTotalLines" class="opacity-75">0 lines</span>
                <span id="statTotalChars" class="opacity-75">0 chars</span>
            </div>
            <span id="langDisplay" class="uppercase font-bold tracking-wider">JavaScript</span>
        </div>
    </footer>

    <!-- 新機能：ポップアップ型保存・ダウンロードモーダル -->
    <div id="downloadModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50 hidden" onclick="closeDownloadModal()">
        <div class="bg-[#252526] border border-[#444] rounded-lg w-11/12 max-w-lg overflow-hidden shadow-2xl transition-all scale-95 duration-200" onclick="event.stopPropagation()">
            <div class="bg-[#2d2d2d] px-4 py-3 border-b border-[#333] flex justify-between items-center">
                <h3 class="text-sm font-bold text-white flex items-center space-x-2">
                    <span>💾</span><span>Download & Backup Manager</span>
                </h3>
                <button onclick="closeDownloadModal()" class="text-gray-400 hover:text-white text-lg font-bold px-1">&times;</button>
            </div>
            <div class="p-4 space-y-4">
                <p class="text-xs text-gray-400 leading-relaxed">
                    ダウンロードするファイルを選択してください。複数のファイルを選択して個別に保存するか、システム全体の完全なスナップショット（HTML）を書き出せます。
                </p>
                
                <div class="border border-[#3c3c3c] bg-[#1e1e1e] rounded max-h-48 overflow-y-auto no-scrollbar p-2">
                    <div class="flex justify-between items-center border-b border-[#3c3c3c] pb-1.5 mb-1.5 px-1">
                        <span class="text-xs font-bold text-gray-400">対象ファイル一覧</span>
                        <button onclick="toggleAllModalCheckboxes()" class="text-[11px] text-[#007acc] hover:underline font-medium">すべて選択/解除</button>
                    </div>
                    <div id="modalFileList" class="space-y-1.5 text-xs"></div>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="downloadSelectedFilesFromModal()" class="bg-[#3c3c3c] hover:bg-[#4e4e4e] text-white border border-[#555] py-2.5 rounded text-center transition font-medium text-xs flex items-center justify-center space-x-1.5">
                        <span>📥</span><span>選択したファイルを保存</span>
                    </button>
                    <button onclick="exportSystemSnapshotFromModal()" class="bg-[#0e639c] hover:bg-[#1177bb] text-white py-2.5 rounded text-center transition font-bold text-xs flex items-center justify-center space-x-1.5">
                        <span>📦</span><span>システム全体を一括保存</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const EXT_MAP = {
            'html': 'html', 'js': 'javascript', 'css': 'css',
            'py': 'python', 'json': 'json',
            'cpp': 'cpp', 'cc': 'cpp', 'h': 'cpp', 'hpp': 'cpp',
            'cs': 'csharp', 'md': 'markdown', 'ts': 'typescript', 
            'txt': 'plaintext', 'sh': 'shell', 'bash': 'shell',
            'sql': 'sql', 'yaml': 'yaml', 'yml': 'yaml', 'xml': 'xml'
        };

        let projectData = {
            files: {
                "main.js": { content: "// Welcome to WebStudio Pro\nconsole.log('Happy Coding!');", lang: "javascript" },
                "src/index.html": { content: "<!DOCTYPE html>\n<html>\n<body>\n  <h1>Hello World</h1>\n</body>\n</html>", lang: "html" },
                "src/styles/app.css": { content: "body { background: #111; color: white; }", lang: "css" }
            },
            settings: {
                fontSize: 16,
                tabSize: 4,
                wordWrap: "on",
                lineNumbers: "on",
                minimap: "off",
                autoSaveDelay: 500,
                theme: "vs-dark",
                sidebarWidth: 200
            },
            // フォルダ開閉ステート管理
            foldersExpanded: {
                "src": true,
                "src/styles": true
            }
        };

        let activeTab = "main.js";
        let editor = null;
        let diffEditor = null;
        let originalModelForDiff = null;
        let monacoInstance = null;
        let autoSaveTimer = null;
        let selectedFiles = new Set();
        let currentSidebarView = 'explorer';
        let wakeLock = null;

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' } });
        
        require(['vs/editor/editor.main'], function() {
            monacoInstance = monaco;
            loadData();

            // 1. 通常エディタインスタンス
            editor = monaco.editor.create(document.getElementById('editorContainer'), {
                automaticLayout: true,
                fontSize: projectData.settings.fontSize,
                tabSize: projectData.settings.tabSize,
                wordWrap: projectData.settings.wordWrap,
                lineNumbers: projectData.settings.lineNumbers,
                minimap: { enabled: projectData.settings.minimap === "on" },
                theme: projectData.settings.theme,
                padding: { top: 10 },
                lineNumbersMinChars: 3
            });

            // 2. 差分エディタインスタンス (新機能)
            diffEditor = monaco.editor.createDiffEditor(document.getElementById('diffContainer'), {
                automaticLayout: true,
                fontSize: projectData.settings.fontSize,
                theme: projectData.settings.theme,
                readOnly: true
            });

            applySidebarWidth(projectData.settings.sidebarWidth || 200);

            // エディタ変更ハンドラ
            editor.onDidChangeModelContent(() => {
                if (projectData.files[activeTab] && activeTab !== "__settings__" && activeTab !== "__diff__") {
                    projectData.files[activeTab].content = editor.getValue();
                    updateFooterCounters();
                    
                    clearTimeout(autoSaveTimer);
                    autoSaveTimer = setTimeout(() => {
                        saveData();
                        if (currentSidebarView === 'search') execGlobalSearch();
                        document.getElementById("statusInfo").innerText = "Auto Saved";
                        setTimeout(() => { document.getElementById("statusInfo").innerText = "Ready"; }, 1000);
                    }, projectData.settings.autoSaveDelay);
                }
            });

            // カーソル及び選択範囲変更イベント（新機能: 英語カウンター連動）
            editor.onDidChangeCursorSelection((e) => {
                const position = editor.getPosition();
                document.getElementById('cursorPos').innerText = `Ln ${position.lineNumber}, Col ${position.column}`;
                
                const selection = editor.getSelection();
                if (selection && !selection.isEmpty()) {
                    const model = editor.getModel();
                    const selectedText = model.getValueInRange(selection);
                    const el = document.getElementById('statSelected');
                    el.innerText = `${selectedText.length} selected`;
                    el.classList.remove('hidden');
                } else {
                    document.getElementById('statSelected').classList.add('hidden');
                }
            });

            setupResizer();
            setupWakeLock();
            renderUI();
            switchTab(activeTab);
        });

        // --- 新機能：画面スリープ防止 (Wake Lock API) ---
        async function setupWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('visibility');
                    document.getElementById("wakeLockStatus").innerHTML = "<span>☕</span><span class='hidden sm:inline'>Awake</span>";
                    
                    // タブ切り替えなどで切れた時の自動再取得
                    document.addEventListener('visibilitychange', async () => {
                        if (wakeLock !== null && document.visibilityState === 'visible') {
                            wakeLock = await navigator.wakeLock.request('visibility');
                        }
                    });
                } catch (err) {
                    document.getElementById("wakeLockStatus").classList.add("hidden");
                }
            } else {
                document.getElementById("wakeLockStatus").classList.add("hidden");
            }
        }

        // --- 新機能：全選択 & 全コピー ---
        function executeSelectAll() {
            if (!editor || activeTab === "__settings__" || activeTab === "__diff__") return;
            const model = editor.getModel();
            const lastLine = model.getLineCount();
            const lastColumn = model.getLineMaxColumn(lastLine);
            editor.setSelection(new monacoInstance.Selection(1, 1, lastLine, lastColumn));
            editor.focus();
        }

        function executeCopyAll() {
            if (!editor || activeTab === "__settings__" || activeTab === "__diff__") return;
            const content = editor.getValue();
            navigator.clipboard.writeText(content).then(() => {
                const status = document.getElementById("statusInfo");
                status.innerText = "Copied All Text!";
                setTimeout(() => { status.innerText = "Ready"; }, 1500);
            }).catch(() => {
                alert("コピーに失敗しました。範囲選択後に手動でコピーしてください。");
            });
        }

        // --- クイック記号挿入ロジック ---
        function insertSymbol(sym) {
            if (!editor || activeTab === "__settings__" || activeTab === "__diff__") return;
            
            const selection = editor.getSelection();
            const selectedText = editor.getModel().getValueInRange(selection);
            
            let textToInsert = sym;
            let targetSelection = null;

            if (sym.length === 2 && ['<>', '{}', '[]', '()', '""', "''"].includes(sym)) {
                const open = sym[0];
                const close = sym[1];
                textToInsert = open + selectedText + close;
                
                targetSelection = new monacoInstance.Selection(
                    selection.startLineNumber,
                    selection.startColumn + 1,
                    selection.endLineNumber,
                    selection.endColumn + 1
                );
            }

            const range = new monacoInstance.Range(
                selection.startLineNumber, selection.startColumn,
                selection.endLineNumber, selection.endColumn
            );

            const op = { identifier: { major: 1, minor: 1 }, range: range, text: textToInsert, forceMoveMarkers: true };
            editor.executeEdits("source", [op]);
            
            if (targetSelection) editor.setSelection(targetSelection);
            editor.focus();
        }

        function insertTemplate() {
            if (!editor || activeTab === "__settings__" || activeTab === "__diff__") return;
            
            const htmlTemplate = `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>`;

            if (confirm("カーソル位置にHTMLの標準雛形を挿入しますか？")) {
                const selection = editor.getSelection();
                const range = new monacoInstance.Range(
                    selection.startLineNumber, selection.startColumn,
                    selection.endLineNumber, selection.endColumn
                );
                const op = { identifier: { major: 1, minor: 1 }, range: range, text: htmlTemplate, forceMoveMarkers: true };
                editor.executeEdits("source", [op]);
                editor.focus();
            }
        }

        // フッター英語カウンター更新処理
        function updateFooterCounters() {
            if (!editor || activeTab === "__settings__" || activeTab === "__diff__") {
                document.getElementById("statTotalLines").innerText = "0 lines";
                document.getElementById("statTotalChars").innerText = "0 chars";
                return;
            }
            const model = editor.getModel();
            if (model) {
                const lineCount = model.getLineCount();
                const charCount = model.getValueLength();
                document.getElementById("statTotalLines").innerText = `${lineCount} lines`;
                document.getElementById("statTotalChars").innerText = `${charCount} chars`;
            }
        }

        // --- 新機能：フォルダ＆ファイルツリー階層レンダリングシステム ---
        function renderUI() {
            const fileList = document.getElementById("fileList");
            const tabBar = document.getElementById("tabBar");
            fileList.innerHTML = "";
            tabBar.innerHTML = "";

            // 1. エクスプローラーの階層ツリー構築
            const tree = {};
            Object.keys(projectData.files).forEach(path => {
                const parts = path.split('/');
                let current = tree;
                let currentPath = "";
                
                parts.forEach((part, i) => {
                    currentPath = currentPath ? `${currentPath}/${part}` : part;
                    if (i === parts.length - 1) {
                        current[part] = { __isFile: true, path: path };
                    } else {
                        if (!current[part]) current[part] = { __isFolder: true, path: currentPath, children: {} };
                        current = current[part].children;
                    }
                });
            });

            function renderNode(node, depth = 0) {
                const container = document.createDocumentFragment();
                
                // フォルダとファイルを仕分けしてソート配置
                const keys = Object.keys(node).sort((a, b) => {
                    const aIsFile = node[a].__isFile;
                    const bIsFile = node[b].__isFile;
                    if (aIsFile !== bIsFile) return aIsFile ? 1 : -1;
                    return a.localeCompare(b);
                });

                keys.forEach(key => {
                    const item = node[key];
                    const element = document.createElement("div");
                    
                    if (item.__isFolder) {
                        const isExpanded = projectData.foldersExpanded[item.path] !== false;
                        element.className = `group flex flex-col w-full text-xs md:text-sm`;
                        
                        const folderHeader = document.createElement("div");
                        folderHeader.className = "flex items-center justify-between px-2 py-1 hover:bg-[#2a2d2e] cursor-pointer text-gray-300";
                        folderHeader.style.paddingLeft = `${(depth * 8) + 8}px`;
                        folderHeader.innerHTML = `
                            <div class="flex items-center truncate flex-1" onclick="toggleFolder('${item.path}')">
                                <span class="mr-1 text-gray-500 scale-90">${isExpanded ? '▼' : '▶'}</span>
                                <span class="mr-1.5 text-yellow-600 font-bold text-sm">📁</span>
                                <span class="truncate font-medium">${key}</span>
                            </div>
                            <div class="opacity-0 group-hover:opacity-100 flex items-center space-x-1 shrink-0">
                                <button onclick="promptNewFile('${item.path}')" class="text-gray-400 hover:text-white px-0.5 text-xs" title="フォルダー内にファイル作成">＋</button>
                                <button onclick="deleteFolder('${item.path}')" class="text-gray-500 hover:text-red-500 px-1 text-xs" title="フォルダー削除">✕</button>
                            </div>
                        `;
                        element.appendChild(folderHeader);

                        if (isExpanded) {
                            const childContainer = renderNode(item.children, depth + 1);
                            element.appendChild(childContainer);
                        }
                    } else {
                        // ファイルノード
                        const isActive = (item.path === activeTab);
                        element.className = `group flex items-center cursor-pointer py-1 text-gray-300 ${isActive ? 'bg-[#37373d] text-white font-medium' : 'hover:bg-[#2a2d2e]'}`;
                        element.style.paddingLeft = `${(depth * 8) + 8}px`;
                        element.style.paddingRight = `8px`;
                        element.innerHTML = `
                            <div class="flex items-center truncate flex-1 py-0.5" onclick="switchTab('${item.path}')" ondblclick="promptRenameFile('${item.path}')">
                                <span class="mr-1.5 flex items-center justify-center w-4 h-4 shrink-0">${getFileIconDom(key)}</span>
                                <span class="truncate text-xs md:text-sm" title="${item.path}">${key}</span>
                            </div>
                            <div class="flex items-center space-x-1.5 opacity-0 group-hover:opacity-100 transition shrink-0">
                                <button onclick="openDiffMode('${item.path}')" class="text-gray-400 hover:text-sky-400 text-[11px]" title="保存前との差分を見る">⚖️</button>
                                <button onclick="promptRenameFile('${item.path}')" class="text-gray-500 hover:text-white text-xs" title="リネーム">✏️</button>
                                <button onclick="deleteFile('${item.path}')" class="text-gray-500 hover:text-red-500 text-sm" title="削除">✕</button>
                            </div>
                        `;
                    }
                    container.appendChild(element);
                });
                return container;
            }

            fileList.appendChild(renderNode(tree));

            // 2. タブバーのレンダリング
            Object.keys(projectData.files).forEach(path => {
                const isActive = (path === activeTab);
                const filename = path.split('/').pop();
                
                const tab = document.createElement("div");
                tab.className = `h-full px-3 flex items-center space-x-1.5 border-r border-[#252526] cursor-pointer transition shrink-0 ${isActive ? 'bg-[#1e1e1e] text-white border-t-2 border-[#007acc]' : 'bg-[#2d2d2d] text-gray-500 hover:bg-[#2b2b2b]'}`;
                tab.innerHTML = `<span class="scale-75 opacity-80 shrink-0">${getFileIconDom(filename)}</span><span class="text-xs font-medium" title="${path}">${filename}</span><span onclick="event.stopPropagation(); closeTab('${path}')" class="hover:text-white ml-1.5 text-xs">×</span>`;
                tab.onclick = () => switchTab(path);
                tabBar.appendChild(tab);
            });

            // 特殊タブ (Settings / Diff Viewer)
            if (activeTab === "__settings__") {
                renderSpecialTab("⚙️ Settings", "__settings__");
            } else if (activeTab === "__diff__") {
                renderSpecialTab("⚖️ Diff View", "__diff__");
            }
        }

        function renderSpecialTab(label, id) {
            const tabBar = document.getElementById("tabBar");
            const sTab = document.createElement("div");
            sTab.className = `h-full px-4 flex items-center space-x-2 border-r border-[#252526] cursor-pointer shrink-0 bg-[#1e1e1e] text-white border-t-2 border-[#007acc]`;
            sTab.innerHTML = `<span class="text-xs">${label}</span><span onclick="event.stopPropagation(); closeTab('${id}')" class="hover:text-white ml-1.5 text-xs">×</span>`;
            tabBar.appendChild(sTab);
        }

        function toggleFolder(path) {
            projectData.foldersExpanded[path] = projectData.foldersExpanded[path] === false;
            saveData();
            renderUI();
        }

        // --- 新機能：差分ビューア（Diff Editor）起動制御 ---
        function openDiffMode(path) {
            if (!monacoInstance || !projectData.files[path]) return;
            
            // ローカルストレージに最後に永続セーブされたデータを取得
            const rawData = localStorage.getItem("webstudio_pro_v10");
            let originalContent = "";
            if (rawData) {
                const parsed = JSON.parse(rawData);
                if (parsed.files[path]) originalContent = parsed.files[path].content;
            }
            
            const currentContent = projectData.files[path].content;
            const fileLang = projectData.files[path].lang;

            // 差分用モデルの生成とバインド
            const originalModel = monacoInstance.editor.createModel(originalContent, fileLang);
            const modifiedModel = monacoInstance.editor.createModel(currentContent, fileLang);

            diffEditor.setModel({
                original: originalModel,
                modified: modifiedModel
            });

            if (originalModelForDiff) originalModelForDiff.dispose();
            originalModelForDiff = originalModel;

            switchTab("__diff__");
            document.getElementById("topFileName").innerText = `Diff: ${path} (Left: Saved | Right: Modified)`;
        }

        function switchTab(target) {
            activeTab = target;
            const editorLayer = document.getElementById("editorLayer");
            const diffLayer = document.getElementById("diffLayer");
            const settingsLayer = document.getElementById("settingsLayer");
            const topFileName = document.getElementById("topFileName");

            // レイヤー全リセット
            editorLayer.classList.remove("active");
            diffLayer.classList.remove("active");
            settingsLayer.classList.remove("active");

            if (target === "__settings__") {
                settingsLayer.classList.add("active");
                topFileName.innerText = "Settings";
                syncSettingsUI();
                updateFooterCounters();
            } else if (target === "__diff__") {
                diffLayer.classList.add("active");
                document.getElementById("langDisplay").innerText = "Diff Viewer";
                updateFooterCounters();
            } else {
                editorLayer.classList.add("active");
                topFileName.innerText = target;

                const file = projectData.files[target];
                if (file && editor) {
                    let model = monacoInstance.editor.getModels().find(m => m.uri.path === `/${target}`);
                    if (!model) {
                        model = monacoInstance.editor.createModel(file.content, file.lang, monacoInstance.Uri.file(target));
                    }
                    editor.setModel(model);
                    document.getElementById("langDisplay").innerText = file.lang;
                    updateFooterCounters();
                }
            }
            renderUI();
        }

        // 新機能：ポップアップモーダル表示ロジック一式
        function openDownloadModal() {
            if (editor && projectData.files[activeTab] && activeTab !== "__settings__" && activeTab !== "__diff__") {
                projectData.files[activeTab].content = editor.getValue();
            }
            
            const listEl = document.getElementById("modalFileList");
            listEl.innerHTML = "";
            
            Object.keys(projectData.files).forEach(path => {
                const isChecked = selectedFiles.has(path);
                const row = document.createElement("label");
                row.className = "flex items-center space-x-2 p-1.5 rounded hover:bg-[#2d2d2d] cursor-pointer text-gray-300 transition truncate";
                row.innerHTML = `
                    <input type="checkbox" data-path="${path}" ${isChecked ? 'checked' : ''} onchange="handleModalCheckboxChange(this)" class="accent-[#007acc] w-3.5 h-3.5 rounded">
                    <span class="truncate">${path}</span>
                `;
                listEl.appendChild(row);
            });

            const modal = document.getElementById("downloadModal");
            modal.classList.remove("hidden");
        }

        function closeDownloadModal() {
            document.getElementById("downloadModal").classList.add("hidden");
        }

        function handleModalCheckboxChange(cb) {
            const path = cb.getAttribute("data-path");
            if (cb.checked) selectedFiles.add(path);
            else selectedFiles.delete(path);
        }

        function toggleAllModalCheckboxes() {
            const checkboxes = document.querySelectorAll("#modalFileList input[type='checkbox']");
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            
            checkboxes.forEach(cb => {
                cb.checked = !allChecked;
                handleModalCheckboxChange(cb);
            });
        }

        function downloadSelectedFilesFromModal() {
            if (selectedFiles.size === 0) return alert("ダウンロードするファイルにチェックを入れてください。");
            
            selectedFiles.forEach(name => {
                const file = projectData.files[name];
                if (!file) return;
                const blob = new Blob([file.content], { type: "text/plain;charset=utf-8" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = name.replace(/\//g, '_'); // 階層スラッシュをアンダースコアに安全変換
                a.click();
                URL.revokeObjectURL(a.href);
            });
            closeDownloadModal();
        }

        function exportSystemSnapshotFromModal() {
            saveData();
            const html = document.documentElement.outerHTML;
            const blob = new Blob([html], { type: "text/html" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "WebStudio_Pro_v10.html";
            a.click();
            URL.revokeObjectURL(a.href);
            closeDownloadModal();
        }

        // 新規作成・フォルダ作成・削除回り
        function promptNewFile(basePath = "") {
            let name = prompt("作成するファイル名を入力してください (階層指定も可能 例: components/Header.js):");
            if (!name) return;
            
            let fullPath = basePath ? `${basePath}/${name}` : name;
            // 連続するスラッシュをクレンジング
            fullPath = fullPath.replace(/\/+/g, '/').replace(/^\//, '');

            if (projectData.files[fullPath]) return alert("そのファイルは既に存在します");
            
            const ext = fullPath.split('.').pop().toLowerCase();
            const lang = EXT_MAP[ext] || 'plaintext';
            
            projectData.files[fullPath] = { content: "", lang: lang };
            saveData();
            switchTab(fullPath);
        }

        function promptNewFolder() {
            let name = prompt("作成するフォルダー名を入力してください (例: assets/css):");
            if (!name) return;
            name = name.replace(/\/+/g, '/').replace(/^\//, '').replace(/\/$/, '');
            
            projectData.foldersExpanded[name] = true;
            saveData();
            renderUI();
        }

        function deleteFolder(folderPath) {
            if (!confirm(`フォルダー「${folderPath}」内の全てのファイルも同時に削除されますがよろしいですか？`)) return;
            
            Object.keys(projectData.files).forEach(path => {
                if (path.startsWith(folderPath + '/')) {
                    delete projectData.files[path];
                    selectedFiles.delete(path);
                    const model = monacoInstance.editor.getModels().find(m => m.uri.path === `/${path}`);
                    if (model) model.dispose();
                }
            });
            delete projectData.foldersExpanded[folderPath];
            saveData();
            
            if (!projectData.files[activeTab]) {
                switchTab(Object.keys(projectData.files)[0]);
            } else {
                renderUI();
            }
        }

        function promptRenameFile(oldPath) {
            const newPath = prompt(`「${oldPath}」の新しいファイルパスを入力してください:`, oldPath);
            if (!newPath || newPath === oldPath) return;
            if (projectData.files[newPath]) return alert("そのファイルパスは既に存在します");

            const ext = newPath.split('.').pop().toLowerCase();
            const lang = EXT_MAP[ext] || 'plaintext';

            projectData.files[newPath] = {
                content: projectData.files[oldPath].content,
                lang: lang
            };
            delete projectData.files[oldPath];

            if (selectedFiles.has(oldPath)) {
                selectedFiles.delete(oldPath);
                selectedFiles.add(newPath);
            }

            const oldModel = monacoInstance.editor.getModels().find(m => m.uri.path === `/${oldPath}`);
            if (oldModel) oldModel.dispose();

            saveData();
            if (activeTab === oldPath) switchTab(newPath);
            else renderUI();
        }

        function closeTab(name) {
            const fileKeys = Object.keys(projectData.files);
            if (name === "__settings__" || name === "__diff__") {
                if (activeTab === name && fileKeys.length > 0) switchTab(fileKeys[0]);
                else renderUI();
            } else {
                if (activeTab === name) {
                    const remaining = fileKeys.filter(k => k !== name);
                    if (remaining.length > 0) switchTab(remaining[0]);
                }
            }
        }

        function deleteFile(name) {
            if (Object.keys(projectData.files).length <= 1) return alert("最後の1ファイルは削除できません");
            if (!confirm(`${name} を削除しますか？`)) return;
            delete projectData.files[name];
            selectedFiles.delete(name);
            const model = monacoInstance.editor.getModels().find(m => m.uri.path === `/${name}`);
            if (model) model.dispose();
            if (activeTab === name) switchTab(Object.keys(projectData.files)[0]);
            else renderUI();
            saveData();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const resizer = document.getElementById("resizer");
            if (sidebar.classList.contains("collapsed")) {
                sidebar.classList.remove("collapsed");
                resizer.classList.remove("hidden");
            } else {
                sidebar.classList.add("collapsed");
                resizer.classList.add("hidden");
            }
            if (editor) editor.layout();
        }

        function applySidebarWidth(targetWidth) {
            const sidebar = document.getElementById("sidebar");
            const windowWidth = window.innerWidth;
            const minW = Math.floor(windowWidth * 0.125);
            const maxW = Math.floor(windowWidth * 0.5);

            let finalWidth = targetWidth;
            if (finalWidth < minW) finalWidth = minW;
            if (finalWidth > maxW) finalWidth = maxW;

            sidebar.style.width = finalWidth + "px";
            projectData.settings.sidebarWidth = finalWidth;
        }

        function setupResizer() {
            const resizer = document.getElementById("resizer");
            const sidebar = document.getElementById("sidebar");
            let isResizing = false;

            function startResize() {
                isResizing = true;
                resizer.classList.add("resizing");
                document.body.style.cursor = "col-resize";
            }

            function resize(e) {
                if (!isResizing) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let newWidth = clientX - sidebar.getBoundingClientRect().left;
                applySidebarWidth(newWidth);
                if (editor) editor.layout();
            }

            function stopResize() {
                if (!isResizing) return;
                isResizing = false;
                resizer.classList.remove("resizing");
                document.body.style.cursor = "default";
                saveData();
            }

            resizer.addEventListener("mousedown", startResize);
            document.addEventListener("mousemove", resize);
            document.addEventListener("mouseup", stopResize);

            resizer.addEventListener("touchstart", startResize);
            document.addEventListener("touchmove", resize);
            document.addEventListener("touchend", stopResize);
        }

        window.addEventListener('resize', () => {
            if (projectData && projectData.settings) {
                applySidebarWidth(projectData.settings.sidebarWidth);
            }
        });

        function switchSidebarView(view) {
            currentSidebarView = view;
            const expView = document.getElementById("sideViewExplorer");
            const scrView = document.getElementById("sideViewSearch");
            const btnExp = document.getElementById("btnNavExplorer");
            const btnScr = document.getElementById("btnNavSearch");

            if (view === 'explorer') {
                expView.classList.remove("hidden");
                scrView.classList.add("hidden");
                btnExp.className = "flex-1 py-2 text-center border-b-2 border-[#007acc] text-white bg-[#252526]";
                btnScr.className = "flex-1 py-2 text-center border-b-2 border-transparent hover:text-white";
            } else {
                scrView.classList.remove("hidden");
                expView.classList.add("hidden");
                btnScr.className = "flex-1 py-2 text-center border-b-2 border-[#007acc] text-white bg-[#252526]";
                btnExp.className = "flex-1 py-2 text-center border-b-2 border-transparent hover:text-white";
                execGlobalSearch();
            }
        }

        function getFileIconDom(name) {
            const ext = name.split('.').pop().toLowerCase();
            switch(ext) {
                case 'html':   return '<i class="devicon-html5-plain icon-html"></i>';
                case 'css':    return '<i class="devicon-css3-plain icon-css"></i>';
                case 'js':     return '<i class="devicon-javascript-plain icon-js"></i>';
                case 'ts':     return '<i class="devicon-typescript-plain icon-ts"></i>';
                case 'py':     return '<i class="devicon-python-plain icon-python"></i>';
                case 'json':   return '<i class="devicon-json-plain icon-json"></i>';
                case 'cpp': case 'cc': case 'h': case 'hpp': 
                               return '<i class="devicon-cplusplus-plain icon-cpp"></i>';
                case 'cs':     return '<i class="devicon-csharp-plain icon-csharp"></i>';
                case 'md':     return '<i class="devicon-markdown-original icon-md"></i>';
                case 'sh': case 'bash': 
                               return '<i class="devicon-bash-plain icon-sh"></i>';
                case 'sql':    return '<i class="devicon-azuresqldatabase-plain icon-sql"></i>';
                case 'yaml': case 'yml': 
                               return '<i class="devicon-yaml-plain icon-yaml"></i>';
                case 'xml':    return '<i class="devicon-xml-plain icon-xml"></i>';
                default:       return '<i class="devicon-matcha-plain icon-txt"></i>';
            }
        }

        function execGlobalSearch() {
            const query = document.getElementById("searchInput").value;
            const container = document.getElementById("searchResultsList");
            const countEl = document.getElementById("searchResultsCount");
            container.innerHTML = "";

            if (!query) {
                countEl.innerText = "0 件のマッチ";
                return;
            }

            if (editor && projectData.files[activeTab] && activeTab !== "__settings__" && activeTab !== "__diff__") {
                projectData.files[activeTab].content = editor.getValue();
            }

            let matchCount = 0;
            Object.keys(projectData.files).forEach(filename => {
                const content = projectData.files[filename].content;
                const lines = content.split('\n');

                lines.forEach((line, index) => {
                    if (line.includes(query)) {
                        matchCount++;
                        const item = document.createElement("div");
                        item.className = "p-1.5 bg-[#1a1a1a] hover:bg-[#2d2d2d] rounded cursor-pointer border border-[#333] transition truncate";
                        item.onclick = () => {
                            switchTab(filename);
                            setTimeout(() => {
                                editor.setPosition({ lineNumber: index + 1, column: line.indexOf(query) + 1 });
                                editor.revealLineInCenter(index + 1);
                                editor.focus();
                            }, 50);
                        };
                        item.innerHTML = `
                            <div class="text-[10px] text-[#007acc] font-bold truncate">${filename} (Ln ${index + 1})</div>
                            <div class="text-gray-400 font-mono text-[11px] truncate">${line.replace(query, `<span class="bg-yellow-500/40 text-white font-bold">${query}</span>`)}</div>
                        `;
                        container.appendChild(item);
                    }
                });
            });
            countEl.innerText = `${matchCount} 件のマッチ`;
        }

        function execGlobalReplace() {
            const searchStr = document.getElementById("searchInput").value;
            const replaceStr = document.getElementById("replaceInput").value;

            if (!searchStr) return alert("検索キーワードを入力してください");
            if (!confirm(`プロジェクト内のすべての「${searchStr}」を「${replaceStr}」に一括置換しますか？`)) return;

            if (editor && projectData.files[activeTab] && activeTab !== "__settings__" && activeTab !== "__diff__") {
                projectData.files[activeTab].content = editor.getValue();
            }

            Object.keys(projectData.files).forEach(filename => {
                const content = projectData.files[filename].content;
                if (content.includes(searchStr)) {
                    projectData.files[filename].content = content.split(searchStr).join(replaceStr);
                    const model = monacoInstance.editor.getModels().find(m => m.uri.path === `/${filename}`);
                    if (model) model.setValue(projectData.files[filename].content);
                }
            });

            saveData();
            if (projectData.files[activeTab] && editor && activeTab !== "__settings__" && activeTab !== "__diff__") {
                editor.setValue(projectData.files[activeTab].content);
            }
            execGlobalSearch();
            alert("一括置換が完了しました。");
        }

        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const name = file.name;
                if (projectData.files[name]) {
                    if (!confirm(`同名のファイル「${name}」が既に存在します。上書きしますか？`)) return;
                }
                const ext = name.split('.').pop().toLowerCase();
                const lang = EXT_MAP[ext] || 'plaintext';
                projectData.files[name] = { content: e.target.result, lang: lang };
                saveData();
                switchTab(name);
                input.value = "";
            };
            reader.readAsText(file);
        }

        function openSettings() { switchTab("__settings__"); }

        function syncSettingsUI() {
            document.getElementById("fontSizeRange").value = projectData.settings.fontSize || 16;
            document.getElementById("fontSizeVal").innerText = projectData.settings.fontSize || 16;
            document.getElementById("tabSizeSelect").value = projectData.settings.tabSize || 4;
            document.getElementById("wordWrapSelect").value = projectData.settings.wordWrap || "on";
            document.getElementById("lineNumbersSelect").value = projectData.settings.lineNumbers || "on";
            document.getElementById("minimapSelect").value = projectData.settings.minimap || "off";
            document.getElementById("autoSaveRange").value = projectData.settings.autoSaveDelay !== undefined ? projectData.settings.autoSaveDelay : 500;
            document.getElementById("autoSaveVal").innerText = (projectData.settings.autoSaveDelay || 0) + "ms";
            document.getElementById("themeSelect").value = projectData.settings.theme || "vs-dark";
        }

        function updateSettingsFromUI() {
            projectData.settings = {
                fontSize: parseInt(document.getElementById("fontSizeRange").value),
                tabSize: parseInt(document.getElementById("tabSizeSelect").value),
                wordWrap: document.getElementById("wordWrapSelect").value,
                lineNumbers: document.getElementById("lineNumbersSelect").value,
                minimap: document.getElementById("minimapSelect").value,
                autoSaveDelay: parseInt(document.getElementById("autoSaveRange").value),
                theme: document.getElementById("themeSelect").value,
                sidebarWidth: projectData.settings.sidebarWidth || 200
            };

            document.getElementById("fontSizeVal").innerText = projectData.settings.fontSize;
            document.getElementById("autoSaveVal").innerText = projectData.settings.autoSaveDelay + "ms";

            const opt = { 
                fontSize: projectData.settings.fontSize,
                tabSize: projectData.settings.tabSize,
                wordWrap: projectData.settings.wordWrap,
                lineNumbers: projectData.settings.lineNumbers,
                minimap: { enabled: projectData.settings.minimap === "on" }
            };
            if (editor) editor.updateOptions(opt);
            if (diffEditor) diffEditor.updateOptions({ fontSize: projectData.settings.fontSize });
            if (monacoInstance) monacoInstance.editor.setTheme(projectData.settings.theme);
            
            saveData();
        }

        function saveData() { localStorage.setItem("webstudio_pro_v10", JSON.stringify(projectData)); }

        function loadData() {
            const saved = localStorage.getItem("webstudio_pro_v10");
            if (saved) {
                projectData = JSON.parse(saved);
                if (Object.keys(projectData.files).length === 0) {
                    projectData.files["main.js"] = { content: "", lang: "javascript" };
                }
                if (!projectData.settings.tabSize) projectData.settings.tabSize = 4;
                if (!projectData.settings.wordWrap) projectData.settings.wordWrap = "on";
                if (!projectData.settings.lineNumbers) projectData.settings.lineNumbers = "on";
                if (!projectData.settings.minimap) projectData.settings.minimap = "off";
                if (!projectData.settings.sidebarWidth) projectData.settings.sidebarWidth = 200;
                if (!projectData.foldersExpanded) projectData.foldersExpanded = {};
                if (projectData.settings.autoSaveDelay === undefined) projectData.settings.autoSaveDelay = 500;
                activeTab = Object.keys(projectData.files)[0];
            }
        }

        function resetAllData() {
            if (confirm("すべてのファイルと設定を消去して初期化しますか？")) {
                localStorage.removeItem("webstudio_pro_v10");
                location.reload();
            }
        }
    </script>
</body>
</html>
