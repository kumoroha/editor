<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web Code Studio Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    
    <style>
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overflow: hidden;
            touch-action: none;
            background-color: #1e1e1e;
            height: 100dvh; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .view-layer { display: none; height: 100%; width: 100%; }
        .view-layer.active { display: block; }
        
        .icon-html { color: #e34f26; }
        .icon-css { color: #1572b6; }
        .icon-js { color: #f7df1e; }
        .icon-ts { color: #3178c6; }
        .icon-python { color: #3776ab; }
        .icon-json { color: #cbcb41; }
        .icon-cpp { color: #00599c; }
        .icon-csharp { color: #239120; }
        .icon-md { color: #ffffff; }
        .icon-txt { color: #858585; }
    </style>
</head>
<body class="text-[#cccccc] flex flex-col select-none">

    <header class="bg-[#3c3c3c] text-white text-[11px] px-3 h-8 flex items-center justify-between border-b border-[#2b2b2b] shrink-0">
        <div class="flex items-center space-x-3">
            <span class="font-bold text-[#007acc]">WebStudio Pro</span>
            <span id="topFileName" class="opacity-60">main.js</span>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="exportSystemSnapshot()" class="hover:text-[#007acc] transition">一括DL保存</button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        
        <aside class="w-12 md:w-56 bg-[#252526] flex flex-col border-r border-[#2b2b2b] shrink-0">
            <div class="p-2 flex items-center justify-between border-b border-[#333] hidden md:flex text-[11px] uppercase tracking-tighter text-gray-400">
                <span>Explorer</span>
                <div class="flex items-center space-x-2">
                    <button onclick="document.getElementById('fileUploadInput').click()" class="hover:bg-[#333] px-1 rounded text-white text-sm" title="ファイルをアップロード">📤</button>
                    <button onclick="promptNewFile()" class="hover:bg-[#333] px-1 rounded text-white text-lg" title="新規ファイル作成">＋</button>
                </div>
            </div>
            
            <input type="file" id="fileUploadInput" class="hidden" onchange="handleFileUpload(this)">
            
            <div id="fileList" class="flex-1 overflow-y-auto no-scrollbar py-2"></div>

            <div class="border-t border-[#333]">
                <button onclick="openSettings()" class="w-full p-3 hover:bg-[#333] flex justify-center md:justify-start items-center space-x-2 transition">
                    <span class="text-sm">⚙️</span>
                    <span class="hidden md:inline text-xs">Settings</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            
            <div id="tabBar" class="flex bg-[#252526] h-9 overflow-x-auto no-scrollbar shrink-0"></div>
            
            <div class="flex-1 relative bg-[#1e1e1e]">
                <div id="editorLayer" class="view-layer active">
                    <div id="editorContainer" class="w-full h-full"></div>
                </div>

                <div id="settingsLayer" class="view-layer bg-[#1e1e1e] p-6 md:p-10 overflow-y-auto">
                    <h2 class="text-2xl mb-6 font-light">Settings</h2>
                    <div class="max-w-xl space-y-8 pb-12">
                        <section>
                            <label class="block text-sm font-bold mb-2 text-gray-400">Editor: Font Size</label>
                            <div class="flex items-center space-x-4">
                                <input type="range" id="fontSizeRange" min="10" max="30" step="1" oninput="updateSettingsFromUI()" class="flex-1">
                                <span id="fontSizeVal" class="w-12 text-center">16</span>
                            </div>
                        </section>

                        <section>
                            <label class="block text-sm font-bold mb-2 text-gray-400">Editor: Tab Size (インデント字数)</label>
                            <select id="tabSizeSelect" onchange="updateSettingsFromUI()" class="w-full bg-[#3c3c3c] border border-[#555] p-2 rounded outline-none text-sm">
                                <option value="2">2 スペース</option>
                                <option value="4">4 スペース</option>
                                <option value="8">8 スペース</option>
                            </select>
                        </section>

                        <section>
                            <label class="block text-sm font-bold mb-2 text-gray-400">Editor: Word Wrap (行の折り返し)</label>
                            <select id="wordWrapSelect" onchange="updateSettingsFromUI()" class="w-full bg-[#3c3c3c] border border-[#555] p-2 rounded outline-none text-sm">
                                <option value="on">on (画面幅で折り返す)</option>
                                <option value="off">off (折り返さない)</option>
                            </select>
                        </section>

                        <section>
                            <label class="block text-sm font-bold mb-2 text-gray-400">Files: Auto Save Delay (自動保存の間隔ミル秒)</label>
                            <div class="flex items-center space-x-4">
                                <input type="range" id="autoSaveRange" min="0" max="5000" step="100" oninput="updateSettingsFromUI()" class="flex-1">
                                <span id="autoSaveVal" class="w-16 text-center">500ms</span>
                            </div>
                            <p class="text-[11px] text-gray-500 mt-1">キーボード入力を止めてから保存されるまでの待ち時間です。(0で完全リアルタイム)</p>
                        </section>

                        <section>
                            <label class="block text-sm font-bold mb-2 text-gray-400">Editor: Color Theme</label>
                            <select id="themeSelect" onchange="updateSettingsFromUI()" class="w-full bg-[#3c3c3c] border border-[#555] p-2 rounded outline-none text-sm">
                                <option value="vs-dark">Visual Studio Dark</option>
                                <option value="vs-light">Visual Studio Light</option>
                                <option value="hc-black">High Contrast</option>
                            </select>
                        </section>

                        <section class="pt-6 border-t border-[#333]">
                            <button onclick="resetAllData()" class="bg-red-900/30 hover:bg-red-900/50 text-red-400 px-4 py-2 rounded text-xs transition">
                                すべてのデータを初期化
                            </button>
                        </section>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer class="bg-[#007acc] text-white text-[10px] px-3 h-5 flex items-center justify-between shrink-0">
        <div id="statusInfo">Ready</div>
        <div class="flex space-x-4">
            <span id="cursorPos">Ln 1, Col 1</span>
            <span id="langDisplay" class="uppercase">JavaScript</span>
        </div>
    </footer>

    <script>
        const EXT_MAP = {
            'html': 'html', 'js': 'javascript', 'css': 'css',
            'py': 'python', 'json': 'json',
            'cpp': 'cpp', 'cc': 'cpp', 'h': 'cpp', 'hpp': 'cpp',
            'cs': 'csharp', 'md': 'markdown', 'ts': 'typescript', 
            'txt': 'plaintext'
        };

        let projectData = {
            files: {
                "main.js": { content: "// Welcome to WebStudio Pro\nconsole.log('Happy Coding!');", lang: "javascript" }
            },
            settings: {
                fontSize: 16,
                tabSize: 4,
                wordWrap: "on",
                autoSaveDelay: 500,
                theme: "vs-dark"
            }
        };

        let activeTab = "main.js";
        let editor = null;
        let monacoInstance = null;
        let autoSaveTimer = null; // デバウンス（間隔保存）用タイマー

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' } });
        
        require(['vs/editor/editor.main'], function() {
            monacoInstance = monaco;
            loadData();

            editor = monaco.editor.create(document.getElementById('editorContainer'), {
                automaticLayout: true,
                fontSize: projectData.settings.fontSize,
                tabSize: projectData.settings.tabSize,
                wordWrap: projectData.settings.wordWrap,
                theme: projectData.settings.theme,
                minimap: { enabled: false },
                padding: { top: 10 },
                lineNumbersMinChars: 3
            });

            // 内容変更のトリガー（設定されたディレイを挟んで自動保存）
            editor.onDidChangeModelContent(() => {
                if (projectData.files[activeTab]) {
                    projectData.files[activeTab].content = editor.getValue();
                    
                    // 古いタイマーをクリアして、入力を止めてから指定ミリ秒後に保存を実行
                    clearTimeout(autoSaveTimer);
                    autoSaveTimer = setTimeout(() => {
                        saveData();
                        document.getElementById("statusInfo").innerText = "Auto Saved";
                        setTimeout(() => { document.getElementById("statusInfo").innerText = "Ready"; }, 1000);
                    }, projectData.settings.autoSaveDelay);
                }
            });

            editor.onDidChangeCursorPosition((e) => {
                document.getElementById('cursorPos').innerText = `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
            });

            renderUI();
            switchTab(activeTab);
        });

        function getFileIconDom(name) {
            const ext = name.split('.').pop().toLowerCase();
            switch(ext) {
                case 'html':   return '<i class="devicon-html5-plain icon-html text-base"></i>';
                case 'css':    return '<i class="devicon-css3-plain icon-css text-base"></i>';
                case 'js':     return '<i class="devicon-javascript-plain icon-js text-base"></i>';
                case 'ts':     return '<i class="devicon-typescript-plain icon-ts text-base"></i>';
                case 'py':     return '<i class="devicon-python-plain icon-python text-base"></i>';
                case 'json':   return '<i class="devicon-json-plain icon-json text-base"></i>';
                case 'cpp': case 'cc': case 'h': case 'hpp': 
                               return '<i class="devicon-cplusplus-plain icon-cpp text-base"></i>';
                case 'cs':     return '<i class="devicon-csharp-plain icon-csharp text-base"></i>';
                case 'md':     return '<i class="devicon-markdown-original icon-md text-base"></i>';
                default:       return '<i class="devicon-matcha-plain icon-txt text-base"></i>';
            }
        }

        function renderUI() {
            const fileList = document.getElementById("fileList");
            const tabBar = document.getElementById("tabBar");
            fileList.innerHTML = "";
            tabBar.innerHTML = "";

            // ファイルリスト
            Object.keys(projectData.files).forEach(name => {
                const isActive = (name === activeTab);
                
                const item = document.createElement("div");
                item.className = `group px-3 py-1.5 flex justify-between items-center cursor-pointer text-sm ${isActive ? 'bg-[#37373d] text-white font-medium' : 'hover:bg-[#2a2d2e]'}`;
                item.innerHTML = `
                    <div class="flex items-center truncate flex-1 py-0.5" onclick="switchTab('${name}')">
                        <span class="mr-2 flex items-center justify-center w-5 h-5">${getFileIconDom(name)}</span>
                        <span class="truncate">${name}</span>
                    </div>
                    <button onclick="deleteFile('${name}')" class="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-500 px-1 text-xs transition">✕</button>
                `;
                fileList.appendChild(item);

                const tab = document.createElement("div");
                tab.className = `h-full px-4 flex items-center space-x-2 text-xs border-r border-[#252526] cursor-pointer transition shrink-0 ${isActive ? 'bg-[#1e1e1e] text-white border-t-2 border-[#007acc]' : 'bg-[#2d2d2d] text-gray-500 hover:bg-[#2b2b2b]'}`;
                tab.innerHTML = `<span class="scale-90 opacity-80">${getFileIconDom(name)}</span><span class="ml-1">${name}</span><span onclick="event.stopPropagation(); closeTab('${name}')" class="hover:text-white ml-2">×</span>`;
                tab.onclick = () => switchTab(name);
                tabBar.appendChild(tab);
            });

            // 設定タブ
            if (activeTab === "__settings__") {
                const sTab = document.createElement("div");
                sTab.className = `h-full px-4 flex items-center space-x-2 text-xs border-r border-[#252526] cursor-pointer shrink-0 bg-[#1e1e1e] text-white border-t-2 border-[#007acc]`;
                sTab.innerHTML = `<span class="text-xs">⚙️</span><span>Settings</span><span onclick="event.stopPropagation(); closeTab('__settings__')" class="hover:text-white ml-2">×</span>`;
                tabBar.appendChild(sTab);
            }
        }

        function switchTab(target) {
            activeTab = target;
            
            const editorLayer = document.getElementById("editorLayer");
            const settingsLayer = document.getElementById("settingsLayer");
            const topFileName = document.getElementById("topFileName");

            if (target === "__settings__") {
                editorLayer.classList.remove("active");
                settingsLayer.classList.add("active");
                topFileName.innerText = "Settings";
                syncSettingsUI();
            } else {
                settingsLayer.classList.remove("active");
                editorLayer.classList.add("active");
                topFileName.innerText = target;

                const file = projectData.files[target];
                if (file && editor) {
                    let model = monacoInstance.editor.getModels().find(m => m.uri.path === `/${target}`);
                    if (!model) {
                        model = monacoInstance.editor.createModel(file.content, file.lang, monacoInstance.Uri.file(target));
                    }
                    editor.setModel(model);
                    document.getElementById("langDisplay").innerText = file.lang;
                }
            }
            renderUI();
        }

        function closeTab(name) {
            // 設定タブ、またはファイルを閉じた際のフォールバック先を計算
            const fileKeys = Object.keys(projectData.files);
            
            if (name === "__settings__") {
                if (activeTab === "__settings__" && fileKeys.length > 0) {
                    switchTab(fileKeys[0]);
                } else {
                    renderUI();
                }
            } else {
                // ファイルタブを閉じる
                if (activeTab === name) {
                    const remaining = fileKeys.filter(k => k !== name);
                    if (remaining.length > 0) {
                        switchTab(remaining[0]);
                    }
                }
            }
        }

        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const name = file.name;
                if (projectData.files[name]) {
                    if (!confirm(`同名のファイル「${name}」が既に存在します。上書きしますか？`)) return;
                }

                const ext = name.split('.').pop().toLowerCase();
                const lang = EXT_MAP[ext] || 'plaintext';

                projectData.files[name] = { content: e.target.result, lang: lang };
                saveData();
                switchTab(name);
                input.value = "";
            };
            reader.readAsText(file);
        }

        function promptNewFile() {
            const name = prompt("ファイル名を入力してください (例: main.cpp, index.html)");
            if (!name) return;
            if (projectData.files[name]) return alert("そのファイル名は既に存在します");

            const ext = name.split('.').pop().toLowerCase();
            const lang = EXT_MAP[ext] || 'plaintext';

            projectData.files[name] = { content: "", lang: lang };
            saveData();
            switchTab(name);
        }

        function deleteFile(name) {
            if (Object.keys(projectData.files).length <= 1) return alert("最後の1ファイルは削除できません");
            if (!confirm(`${name} を削除しますか？`)) return;

            delete projectData.files[name];
            
            const model = monacoInstance.editor.getModels().find(m => m.uri.path === `/${name}`);
            if (model) model.dispose();

            if (activeTab === name) {
                switchTab(Object.keys(projectData.files)[0]);
            } else {
                renderUI();
            }
            saveData();
        }

        function openSettings() {
            switchTab("__settings__");
        }

        // --- 新規設定項目の同期と反映ロジック ---
        function syncSettingsUI() {
            document.getElementById("fontSizeRange").value = projectData.settings.fontSize || 16;
            document.getElementById("fontSizeVal").innerText = projectData.settings.fontSize || 16;
            
            document.getElementById("tabSizeSelect").value = projectData.settings.tabSize || 4;
            document.getElementById("wordWrapSelect").value = projectData.settings.wordWrap || "on";
            
            document.getElementById("autoSaveRange").value = projectData.settings.autoSaveDelay !== undefined ? projectData.settings.autoSaveDelay : 500;
            document.getElementById("autoSaveVal").innerText = (projectData.settings.autoSaveDelay || 0) + "ms";
            
            document.getElementById("themeSelect").value = projectData.settings.theme || "vs-dark";
        }

        function updateSettingsFromUI() {
            const size = document.getElementById("fontSizeRange").value;
            const tabSize = document.getElementById("tabSizeSelect").value;
            const wordWrap = document.getElementById("wordWrapSelect").value;
            const autoSaveDelay = document.getElementById("autoSaveRange").value;
            const theme = document.getElementById("themeSelect").value;

            projectData.settings = {
                fontSize: parseInt(size),
                tabSize: parseInt(tabSize),
                wordWrap: wordWrap,
                autoSaveDelay: parseInt(autoSaveDelay),
                theme: theme
            };

            document.getElementById("fontSizeVal").innerText = size;
            document.getElementById("autoSaveVal").innerText = autoSaveDelay + "ms";

            if (editor) {
                editor.updateOptions({ 
                    fontSize: projectData.settings.fontSize,
                    tabSize: projectData.settings.tabSize,
                    wordWrap: projectData.settings.wordWrap
                });
                if (monacoInstance) monacoInstance.editor.setTheme(theme);
            }
            saveData();
        }

        function saveData() {
            localStorage.setItem("webstudio_pro_v5", JSON.stringify(projectData));
        }

        function loadData() {
            const saved = localStorage.getItem("webstudio_pro_v5");
            if (saved) {
                projectData = JSON.parse(saved);
                if (Object.keys(projectData.files).length === 0) {
                    projectData.files["main.js"] = { content: "", lang: "javascript" };
                }
                // オプションのデフォルト値補正
                if (!projectData.settings.tabSize) projectData.settings.tabSize = 4;
                if (!projectData.settings.wordWrap) projectData.settings.wordWrap = "on";
                if (projectData.settings.autoSaveDelay === undefined) projectData.settings.autoSaveDelay = 500;
                
                activeTab = Object.keys(projectData.files)[0];
            }
        }

        function resetAllData() {
            if (confirm("すべてのファイルと設定を消去して初期化しますか？")) {
                localStorage.removeItem("webstudio_pro_v5");
                location.reload();
            }
        }

        function exportSystemSnapshot() {
            saveData();
            const html = document.documentElement.outerHTML;
            const blob = new Blob([html], { type: "text/html" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "WebStudio_Pro_v5.html";
            a.click();
        }
    </script>
</body>
</html>
